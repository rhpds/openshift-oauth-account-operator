{{- if eq (.Values.config).type "HTPasswd" -}}
{{- $htpasswdSecretName := ((.Values.config.htpasswd).htpasswdSecret).name | default "htpasswd" -}}
{{- $htpasswdSecretNamespace := ((.Values.config.htpasswd).htpasswdSecret).namespace | default "openshift-config" -}}
---
apiVersion: openshift-oauth-account.demo.redhat.com/v1
kind: OAuthProvider
metadata:
  name: cluster
  labels:
    {{- include "openShiftOAuthAccountOperator.labels" . | nindent 4 }}
spec:
  type: HTPasswd
  htpasswd:
    htpasswdSecret:
      name: {{ $htpasswdSecretName }}
      namespace: {{ $htpasswdSecretNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openShiftOAuthAccountOperator.namespaceName" . }}:{{ include "openShiftOAuthAccountOperator.name" . }}
  namespace: {{ $htpasswdSecretNamespace }}
  labels:
    {{- include "openShiftOAuthAccountOperator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - {{ $htpasswdSecretName }}
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openShiftOAuthAccountOperator.namespaceName" . }}:{{ include "openShiftOAuthAccountOperator.name" . }}
  namespace: {{ $htpasswdSecretNamespace }}
  labels:
    {{- include "openShiftOAuthAccountOperator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openShiftOAuthAccountOperator.namespaceName" . }}:{{ include "openShiftOAuthAccountOperator.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "openShiftOAuthAccountOperator.serviceAccountName" . }}
  namespace: {{ include "openShiftOAuthAccountOperator.namespaceName" . }}
{{- end -}}
