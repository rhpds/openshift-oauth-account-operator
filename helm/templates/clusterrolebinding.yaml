{{- if .Values.deploy -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "openShiftOAuthAccountOperator.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "openShiftOAuthAccountOperator.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "openShiftOAuthAccountOperator.serviceAccountName" . }}
  namespace: {{ include "openShiftOAuthAccountOperator.namespaceName" . }}
{{- end -}}
